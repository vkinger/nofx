services:
  # PostgreSQL Database
  nofx-postgres:
    image: postgres:16-alpine
    container_name: nofx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nofx_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nofx_password}
      POSTGRES_DB: ${DB_NAME:-nofx}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - nofx-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-nofx}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # SQLite to PostgreSQL 迁移工具
  pgloader:
    image: dimitri/pgloader:latest
    container_name: nofx-pgloader
    volumes:
      - ./data:/data
      - ./scripts:/scripts
    networks:
      - nofx-network
    depends_on:
      - nofx-postgres
    profiles:
      - migrate  # 使用 profile，需要时手动运行
    command: >
      pgloader
      --with "data only"
      --cast "type boolean to boolean using tinyint-to-boolean"
      sqlite:///data/data.db
      postgresql://nofx_user:nofx_password@nofx-postgres:5432/nofx
  # Backend service (API and core logic)
  nofx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-trading
    restart: unless-stopped
    stop_grace_period: 30s  # 允许应用有 30 秒时间优雅关闭
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
      - "6060:6060"  # pprof profiling
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
    networks:
      - nofx-network
    depends_on:
      - nofx-postgres
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nofx-frontend
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-80}:80"
    networks:
      - nofx-network
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    driver: bridge