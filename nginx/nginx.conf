# nginx.conf - Extracted Nginx configuration for NOFX Frontend
# This configuration merges enhancements from provided variants: improved gzip, static asset caching, adjusted API proxy (preserving /api/ path), extended timeouts, and a static health response for frontend independence.

# 上游用内部服务名；resolver 由 entrypoint 替换为容器内部 DNS（/etc/resolv.conf）
map $http_referer $api_upstream {
    default             "nofx:8080";
    "~*aiclient-api"    "aiclient-api:3000";
}

# HTTP server (redirects to HTTPS in production)
server {
    listen 80;
    server_name localhost;

    # Frontend root
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (enhanced)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Frontend routes (SPA) with static asset caching
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Proxy API requests - route based on referer
    # Requests from aiclient-api pages (referer contains "aiclient-api") go to aiclient-api service
    # Other requests go to NOFX backend
    location /api/ {
        # Debug: log routing decision with referer and upstream
        access_log /var/log/nginx/api_routing.log combined;
        error_log /var/log/nginx/api_routing_error.log warn;
        
        # 使用内部 DNS 解析 nofx / aiclient-api；启动时 __NGINX_RESOLVER__ 替换为容器 /etc/resolv.conf 的 nameserver（Podman/Docker 兼容）
        resolver __NGINX_RESOLVER__ valid=30s ipv6=off;
        set $backend "http://$api_upstream$request_uri";
        proxy_pass $backend;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeout for long-running API calls
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 处理 /aiclient-api（无尾部斜杠）- 重定向到 index.html（主页面）
    location = /aiclient-api {
        return 301 /aiclient-api/index.html;
    }

    # 处理 /aiclient-api/（带尾部斜杠）- 重定向到 index.html（主页面）
    location = /aiclient-api/ {
        return 301 /aiclient-api/index.html;
    }

    # 代理 aiclient-api 服务的所有路径（包括静态文件和 API）
    location /aiclient-api/ {
        # 移除 /aiclient-api/ 前缀，代理到 aiclient-api 服务根路径
        proxy_pass http://aiclient-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /aiclient-api;

        # 禁用上游 gzip，以便 sub_filter 可以处理响应
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # 重写 HTTP 重定向响应头
        proxy_redirect / /aiclient-api/;
        proxy_redirect http://aiclient-api:3000/ /aiclient-api/;
        
        # 替换 JS 中的跳转路径
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;
        # 替换跳转到根路径 /
        sub_filter "window.location.href = '/'" "window.location.href = '/aiclient-api/index.html'";
        sub_filter "window.location.href='/'" "window.location.href='/aiclient-api/index.html'";
        sub_filter 'window.location.href = "/"' 'window.location.href = "/aiclient-api/index.html"';
        sub_filter 'window.location.href="/"' 'window.location.href="/aiclient-api/index.html"';
        # 替换跳转到 /login.html（auth.js 中的跳转）
        sub_filter "window.location.href = '/login.html'" "window.location.href = '/aiclient-api/login.html'";
        sub_filter "window.location.href='/login.html'" "window.location.href='/aiclient-api/login.html'";
        sub_filter 'window.location.href = "/login.html"' 'window.location.href = "/aiclient-api/login.html"';
        sub_filter 'window.location.href="/login.html"' 'window.location.href="/aiclient-api/login.html"';
    }

    # Health check endpoint (static response for frontend health, independent of backend)
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
        access_log off;
    }

    # Optional: Redirect HTTP to HTTPS (uncomment for production)
    # return 301 https://$server_name$request_uri;
}

